# Path-based routing (L7): /tickets -> Service tickets, /orders -> Service orders.
# The annotation attaches the Middleware strip-prefix (namespace default).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bilheteira
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares:
      default-strip-prefix@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /tickets
            pathType: Prefix
            backend:
              service:
                name: tickets
                port:
                  number: 3001
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 3002
