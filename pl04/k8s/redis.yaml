# Redis is a counter store used only by STOCK_STRATEGY=redis-atomic.
# Automatic snapshots are OFF on purpose (--save ""): a Redis that restarts
# without a snapshot comes back empty, and tickets rebuilds the counter from
# Postgres. /data is an emptyDir: it survives a restart of the container, not
# the deletion of the Pod. A snapshot taken by hand (redis-cli save) is loaded
# when the container restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
