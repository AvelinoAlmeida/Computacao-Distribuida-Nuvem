apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
data:
  TICKETS_URL: http://tickets:3001
  TICKETS_TIMEOUT_MS: "2000"
  TICKETS_RETRIES: "2"
  TICKETS_BACKOFF_MS: "100"
  NOTIFY_MODE: sync              # sync | async
  NOTIFICATIONS_URL: http://notifications:3003
  NOTIFY_TIMEOUT_MS: "5000"
  PG_POOL_MAX: "10"
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      containers:
        - name: orders
          image: cdn-orders:1.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3002 }]
          envFrom:
            - configMapRef: { name: orders-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres, key: ORDERS_DATABASE_URL }
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: { name: rabbitmq, key: RABBITMQ_URL }
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          readinessProbe:
            httpGet: { path: /ready, port: 3002 }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector: { app: orders }
  ports: [{ port: 3002, targetPort: 3002 }]
