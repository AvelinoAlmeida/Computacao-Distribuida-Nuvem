# Lab credentials in plain text (stringData).
# Base64 is NOT encryption; never do this outside a lab.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: lab-cdn-pw
  TICKETS_DATABASE_URL: postgres://app:lab-cdn-pw@postgres:5432/tickets
  ORDERS_DATABASE_URL: postgres://app:lab-cdn-pw@postgres:5432/orders
  NOTIFICATIONS_DATABASE_URL: postgres://app:lab-cdn-pw@postgres:5432/notifications
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: app
  RABBITMQ_DEFAULT_PASS: lab-cdn-pw
  RABBITMQ_URL: amqp://app:lab-cdn-pw@rabbitmq:5672
