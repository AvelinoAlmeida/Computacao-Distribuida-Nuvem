apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bilheteira
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /tickets
            pathType: Prefix
            backend:
              service:
                name: tickets
                port: { number: 3001 }
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders
                port: { number: 3002 }
