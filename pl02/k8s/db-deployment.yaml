apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      # The local-path volume lives on one node's disk; the Pod is pinned to the server node.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          envFrom:
            - configMapRef: { name: db-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db, key: POSTGRES_PASSWORD }
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
